<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Calendar</title><link rel="stylesheet" href="style.css"></head><body class="popup"><svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="4"/><path d="M7 3v4m10-4v4M3 11h18m-12 5h.01M15 16h.01"/></symbol>

<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>

</defs></svg><main class="popup-shell"><header class="app-header"><div class="brand"><div class="brand-icon"><svg class="icon " aria-hidden="true"><use href="#i-calendar"/></svg></div><div><span class="brand-name">My Calendar<span class="brand-spark">✦</span></span><span class="brand-sub">EPITECH <span>→</span> GOOGLE</span></div></div><button id="settings" class="icon-button" aria-label="Ouvrir les réglages"><svg class="icon " aria-hidden="true"><use href="#i-settings"/></svg></button></header><section class="account-bar" aria-label="Compte Google"><span id="accountAvatar" class="account-avatar" aria-hidden="true">G</span><div class="account-copy"><span id="accountStatus">Déconnecté de Google</span><strong id="accountEmail">Aucun compte connecté</strong></div><button id="quickDisconnect" class="text-button" hidden>Déconnecter</button></section><section class="sync-card" aria-labelledby="syncTitle"><div class="card-glow"></div><div class="hero-top"><span class="eyebrow">TON PLANNING, CONNECTÉ</span><button id="syncStatus" class="status-pill" title="État du dernier import ; cliquer pour synchroniser"><span class="status-dot"></span><span id="statusLabel">Chargement</span></button></div><div class="hero-content"><div><h1 id="syncTitle">Un instant…</h1><p id="syncSubtitle">On retrouve ton calendrier.</p></div><div id="heroVisual" class="hero-visual"><svg class="icon " aria-hidden="true"><use href="#i-calendar"/></svg></div></div><div class="hero-actions"><button id="connect" class="button google-button" hidden><span class="google-mark" aria-hidden="true">G</span>Connecter Google<svg class="icon " aria-hidden="true"><use href="#i-arrow"/></svg></button><button id="force" class="button primary" disabled><svg class="icon sync-icon" aria-hidden="true"><use href="#i-sync"/></svg><span>Synchroniser manuellement</span></button></div><div id="progress" class="progress-track" hidden><span></span></div></section>
<div id="notice" class="notice" role="status" hidden></div>
<div class="stats"><div class="stat"><svg class="icon " aria-hidden="true"><use href="#i-clock"/></svg><div><span>Dernier import</span><strong id="lastSync">Jamais</strong></div></div><div class="stat"><svg class="icon " aria-hidden="true"><use href="#i-calendar"/></svg><div><span>Événements</span><strong id="eventCount">—</strong></div></div></div><section class="agenda-card"><div class="section-heading"><h2>Ta semaine</h2><span id="monthLabel" class="muted"></span></div><div id="weekStrip" class="week-strip" role="group" aria-label="Choisir un jour"></div><div class="agenda-heading"><span id="selectedDayLabel">Aujourd’hui</span><span id="dayCount" class="muted"></span></div><div id="events" class="event-list"></div><p class="calendar-note">Aperçu du dernier import · horaires de Paris</p></section><footer class="app-footer"><span><svg class="icon " aria-hidden="true"><use href="#i-bolt"/></svg>Auto à la première visite du jour</span><button id="autoToggle" class="toggle" role="switch" aria-checked="true" aria-label="Synchronisation automatique"><span></span></button></footer></main><script src="core.js"></script><script src="ui.js"></script><script src="popup.js"></script></body></html>
